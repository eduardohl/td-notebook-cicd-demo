bundle:
  name: td-notebook-cicd-demo

include:
  - resources/*.yml

# One commit, three environments: dev -> engineering -> prod.
# In this demo they all live in a SINGLE workspace and are separated by
# workspace path (root_path), catalog variable, and deploying identity.
# In real life each target points at its own workspace.
#
# Each environment has its own service principal. The pipeline signs in as that
# environment's identity, so root_path below resolves to that identity's home
# folder and the jobs run as it. The dev identity cannot write to prod.
variables:
  env:
    default: dev
  catalog:
    default: dev_catalog
  schema:
    default: ingestion
  git_sha:
    description: Commit being deployed, recorded as a job tag
    default: local
  release_id:
    description: Pipeline run that deployed it (stand-in for the change order / Nexus hash)
    default: local

targets:
  dev:
    default: true
    mode: development   # name-prefixes resources, pauses schedules, allows concurrent runs
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.cicd-demo/dev
    variables:
      env: dev
      catalog: dev_catalog

  # Engineering workspace: validation on real (governed) data, after lead approval.
  engineering:
    mode: production
    git:
      branch: main   # production mode refuses to deploy from any other branch
    run_as:
      service_principal_name: 5af5e7a0-438e-4b1d-867e-6af91bb27207   # cicd-demo-engineering-sp
    # People can view what's deployed; only the environment's identity can change it.
    permissions:
      - level: CAN_MANAGE
        service_principal_name: 5af5e7a0-438e-4b1d-867e-6af91bb27207
      - level: CAN_VIEW
        group_name: users
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.cicd-demo/engineering
    variables:
      env: engineering
      catalog: engineering_catalog

  # Production: after change-order approval.
  prod:
    mode: production
    git:
      branch: main
    run_as:
      service_principal_name: 01e48edb-0d58-4e3b-ae2d-0c9bc1cfd98b   # cicd-demo-prod-sp
    permissions:
      - level: CAN_MANAGE
        service_principal_name: 01e48edb-0d58-4e3b-ae2d-0c9bc1cfd98b
      - level: CAN_VIEW
        group_name: users
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.cicd-demo/prod
    variables:
      env: prod
      catalog: cz_prod_catalog
