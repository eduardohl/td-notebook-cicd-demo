resources:
  jobs:
    silly_demo:
      name: "silly-cicd-demo-${var.env}"
      # Traceability: every deployed job says which commit and which pipeline run put it there.
      tags:
        git_sha: ${var.git_sha}
        release_id: ${var.release_id}
      # No cluster specified -> runs on serverless compute.
      tasks:
        - task_key: say_hello
          notebook_task:
            notebook_path: ../src/notebooks/hello.py
            base_parameters:
              env: ${var.env}
              catalog: ${var.catalog}
              schema: ${var.schema}
