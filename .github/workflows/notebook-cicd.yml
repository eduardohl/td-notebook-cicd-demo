name: notebook-cicd

# Trunk-based CI/CD for Databricks notebooks via Asset Bundles.
# Promotion path: dev -> pat (QA gate) -> prod, in ONE run for ONE commit.
#   - PR to main     -> validate only (nothing deployed)
#   - merge to main  -> deploy dev -> PAT approval -> deploy pat
#                       -> prod approval -> deploy prod
# Each stage `needs` the one before it, so no environment can be skipped, and
# only main can deploy (checked here, by the GitHub environment branch policy,
# and by git.branch on the pat/prod bundle targets).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # re-run the full chain for the current main

# Auth for the Databricks CLI comes from repo secrets.
# OAuth M2M as a service principal (Databricks-recommended for CI/CD): the CLI
# picks up these three env vars automatically. No personal tokens in CI.
env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.20.0
      - name: Validate bundle
        run: databricks bundle validate --strict -t dev

  deploy-dev:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    concurrency: # never let two deploys to the same environment overlap
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.20.0
      - name: Deploy to DEV
        run: databricks bundle deploy -t dev
      - name: Smoke-run in DEV
        run: databricks bundle run silly_demo -t dev

  deploy-pat:
    needs: deploy-dev
    runs-on: self-hosted
    environment: pat # QA sign-off: required reviewer on the GitHub environment
    concurrency:
      group: deploy-pat
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.20.0
      - name: Deploy to PAT
        run: databricks bundle deploy -t pat
      - name: Run in PAT
        run: databricks bundle run silly_demo -t pat

  deploy-prod:
    needs: deploy-pat
    runs-on: self-hosted
    environment: prod # release approval: required reviewer on the GitHub environment
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.20.0
      - name: Deploy to PROD
        run: databricks bundle deploy -t prod
      - name: Run in PROD
        run: databricks bundle run silly_demo -t prod
